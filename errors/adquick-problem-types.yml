notes: >-
  Confirmed live: api.adquick.com returns RFC 9457 (application/problem+json) error responses. The
  envelope carries type/title/status/instance plus a trace object (timestamp, requestId, buildId,
  rayId). The `type` URI resolves to httpproblems.com/http-status/<code>. Statuses below are the
  standard HTTP set the API returns; the 404 shape was captured from a live request. The MCP server
  at www.adquick.com/mcp returns a JSON-RPC/OAuth error shape instead
  ({"error":"unauthorized","error_description":"The access token is invalid"}).
