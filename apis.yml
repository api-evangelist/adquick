name: AdQuick
description: >-
  AdQuick is an intelligence and marketplace platform for out-of-home (OOH) advertising that lets
  advertisers plan, buy, execute, and measure billboard, transit, street-furniture, and programmatic
  digital-out-of-home (DOOH) campaigns across a network of 1,500+ media owners covering close to 100%
  of US OOH supply. AdQuick exposes a partner REST API (X-PARTNER-TOKEN authentication) at
  api.adquick.com for planning guaranteed and auction OOH campaigns, placing insertion orders,
  submitting and scheduling creatives, and pulling in-flight delivery reporting, plus a hosted Model
  Context Protocol (MCP) server (OAuth 2.0 + PKCE) at www.adquick.com/mcp that gives AI agents
  natural-language access to inventory discovery, campaign management, market analytics, exports, and
  programmatic DSP tooling. Backed by Initialized Capital.
