notes: >-
  AdQuick publishes no API versioning policy, no deprecation policy, no Sunset/Deprecation header
  contract (RFC 8594), no SLA, and no confirmable status page. The partner REST API is served from an
  unversioned host (https://api.adquick.com) with no version segment in any documented path and no
  version header documented. The one real lifecycle signal AdQuick does publish is on the MCP side:
  the hosted server advertises the set of Model Context Protocol revisions it still accepts, which is
  a genuine backward-compatibility window. status.adquick.com resolves to the same Cloudflare edge as
  every other adquick.com subdomain and returns a 403 bot challenge, and adquick.statuspage.io
  resolves to the Atlassian Statuspage marketing site rather than a tenant page - neither confirms a
  status page exists, so NO StatusPage pointer is emitted. No Deprecation pointer is emitted either.
