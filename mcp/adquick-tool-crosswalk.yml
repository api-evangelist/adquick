notes: >-
  AdQuick publishes NO OpenAPI, so the REST side of this crosswalk is a list of DOCUMENTED PATHS from
  the developer documentation, not operationIds from a spec - there are no operationIds to bind to.
  The MCP side is the real, provider-published tool list (39 tools) but its inputSchemas are
  auth-gated: an anonymous tools/list POST to https://www.adquick.com/mcp returns HTTP 401
  {"error":"unauthorized"}. Every binding below is therefore mapped by NAME AND DOCUMENTED SEMANTICS,
  and confidence is set accordingly - never higher than medium. The dominant finding is divergence:
  the MCP server is not a wrapper over the partner REST API, it is a much larger, separate surface.
  36 of 39 MCP tools have no documented public REST equivalent, and the REST API's core commercial
  act - booking a campaign (POST /campaigns/:id/book) - has no MCP tool at all.
